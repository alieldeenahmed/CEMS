name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test, incl. PostgreSQL)
    runs-on: ubuntu-latest

    # A real PostgreSQL for CEMS.Postgres.Tests: migrations, exclusion constraints, advisory locks and
    # genuinely concurrent requests can't be tested on SQLite. It is a throwaway container of the runner's own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CEMS_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Backend/CEMS.sln

      - name: Build
        run: dotnet build Backend/CEMS.sln --configuration Release --no-restore

      - name: Test (unit, integration, PostgreSQL)
        run: dotnet test Backend/CEMS.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
