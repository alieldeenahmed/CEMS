name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test, incl. PostgreSQL)
    runs-on: ubuntu-latest

    # A real PostgreSQL for CEMS.Postgres.Tests: migrations, exclusion constraints, advisory locks and
    # genuinely concurrent requests can't be tested on SQLite. It is a throwaway container of the runner's own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CEMS_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Backend/CEMS.sln

      - name: Build
        run: dotnet build Backend/CEMS.sln --configuration Release --no-restore

      - name: Test (unit, integration, PostgreSQL)
        run: dotnet test Backend/CEMS.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Proves the README's one-command path actually works from a clean checkout: build the API image, start
  # PostgreSQL + the API (migrations applied by Database__MigrateOnStartup), seed it with the bash seeder,
  # then exercise a few real endpoints (sign in, a data read, the Swagger document, a QuestPDF export).
  smoke:
    name: Docker Compose smoke test (API + PostgreSQL + seed)
    runs-on: ubuntu-latest
    env:
      API: http://localhost:5272
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose --profile app up -d --build --wait --wait-timeout 240

      - name: Seed demo data
        run: ./scripts/seed-demo-data.sh

      - name: Exercise the API
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST "$API/api/auth/login" -H 'Content-Type: application/json'             -d '{"email":"owner@codecamp.demo","password":"DemoPass123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          test -n "$token"
          # Capture first, then grep: `curl | grep -q` makes curl fail with 23 when grep exits early under pipefail.
          students=$(curl -fsS -H "Authorization: Bearer $token" "$API/api/students")
          echo "$students" | grep -q "Khaled Hany"
          swagger=$(curl -fsS "$API/swagger/v1/swagger.json")
          echo "$swagger" | grep -q '"openapi"'
          today=$(date -u +%F)
          curl -fsS -H "Authorization: Bearer $token"             "$API/api/analytics/dashboard/export/pdf?periodStart=${today}&periodEnd=${today}" -o dashboard.pdf
          head -c 4 dashboard.pdf | grep -q '%PDF'

      - name: Container logs (on failure)
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
