# Local demo stack. Not a production deployment: the credentials and JWT key below are development defaults.
#
#   docker compose up -d                         # PostgreSQL only (run the API on the host)
#   docker compose --profile app up -d --build   # PostgreSQL + the API (applies migrations on start)
#
# Override any ${VAR:-default} via a .env file (see .env.example).
name: cems

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cems_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cems}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cems-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ./Backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development so Swagger UI is served at /swagger.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cems};Username=${POSTGRES_USER:-cems};Password=${POSTGRES_PASSWORD:-cems_dev_password}
      Jwt__Key: ${JWT_KEY:-dev-only-insecure-key-replace-me-0123456789abcdef}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # Explicit opt-in: build/upgrade the schema on startup so `up` is the only command needed.
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-5272}:8080"

volumes:
  cems-pgdata:
